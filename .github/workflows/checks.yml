name: Reproduction checks
on: [push, pull_request, workflow_dispatch]
jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m unittest discover -s tests -p test_metrics.py -v
      - run: python main.py all --font "DejaVu Serif"
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-model.txt
      - run: python -m unittest discover -s tests -v
      - run: python main.py demo --steps 8 --threads 1 --out outputs/ci_demo
